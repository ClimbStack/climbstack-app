name: Build Android APK

on:
  push:
    tags:
      - 'v*' # Triggera la build quando crei un tag (es. v1.0.0)
  workflow_dispatch: # Permette di far partire la build manualmente da GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore" 2>/dev/null || echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            cp "$GITHUB_WORKSPACE/release.keystore" android/release.keystore 2>/dev/null || true
            cp "$GITHUB_WORKSPACE/release.keystore" android/app/release.keystore 2>/dev/null || true
          fi

      - name: 🔨 Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/release.keystore"
          SIGNING_PROPS=()

          if [ -f "$KEYSTORE_PATH" ] && keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "Keystore and credentials verified successfully. Building signed release APK."
            SIGNING_PROPS=(
              "-Pandroid.injected.signing.store.file=$KEYSTORE_PATH"
              "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
            )
          else
            echo "Keystore verification failed or not provided. Falling back to default debug keystore signing."
            SIGNING_PROPS=(
              "-Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/debug.keystore"
              "-Pandroid.injected.signing.store.password=android"
              "-Pandroid.injected.signing.key.alias=androiddebugkey"
              "-Pandroid.injected.signing.key.password=android"
            )
          fi

          cd android && ./gradlew assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" \
            "${SIGNING_PROPS[@]}"

      - name: 📂 Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClimbStack-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: ClimbStack ${{ github.ref_name }}
          generate_release_notes: true

name: Build Android APK

on:
  push:
    tags:
      - 'v*' # Triggera la build quando crei un tag (es. v1.0.0)
  workflow_dispatch: # Permette di far partire la build manualmente da GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build APK
        run: cd android && ./gradlew assembleRelease

      - name: 📂 Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClimbStack-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: ClimbStack ${{ github.ref_name }}
          generate_release_notes: true
